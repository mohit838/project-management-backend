services:
  db:
    image: postgres:17-alpine
    container_name: pm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pm-network

  app:
    image: ${APP_IMAGE:-pm-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm-backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "${APP_EXTERNAL_PORT}:3214"
    networks:
      - pm-network

networks:
  pm-network:
    driver: bridge

volumes:
  postgres_data:
